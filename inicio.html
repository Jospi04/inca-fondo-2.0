<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="login, usuario, clave">
    <meta name="description" content="login con HTML, CSS y JavaScript">
    <title>Login y registro</title>
    <link rel="icon" type="image/ico" href="img/money2.png">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor-header">
        <header>
            <div class="logo">
                <a href="#">IncaFondo</a>
            </div>
            <nav id="nav">
                <ul>
                    <!-- Puedes agregar enlaces de navegación aquí si lo deseas -->
                </ul>
            </nav>
            <div class="nav-responsive" onclick="mostrarOcultarMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>
    </div>

    <section id="inicio" class="inicio">
        <main class="container login">
            <div class="login-information">
                <div class="info-childs">
                    <h2>Bienvenido Nuevamente</h2>
                    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nemo ad, molestiae asperiores quos ut nostrum libero beatae dolor quibusdam veniam error</p>
                </div>
            </div>
            <div class="registro-information">
                <div class="registro-information-childs">
                    <h2>Iniciar Sesión</h2>
                    <div class="icons">
                        <i class='bx bxl-google'></i>
                        <i class='bx bxl-github'></i>
                        <i class='bx bxl-linkedin'></i>
                    </div>
                    <p>Iniciar sesión con una cuenta</p>
                    <form>
                        <label for="userRole">
                            <i class='bx bxs-user'></i>
                            <select name="userRole" id="userRole" class="border p-2 w-full mb-2 rounded">
                                <option value="client">Cliente</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </label>
                        <label for="">
                            <i class='bx bxs-envelope'></i>
                            <input type="email" name="txtCorreo" id="txtCorreo" placeholder="Correo">
                        </label>
                        <label for="">
                            <i class='bx bxs-lock-alt'></i>
                            <input type="password" name="txtClave" id="txtPassword" placeholder="Contraseña">
                        </label>
                        <input type="submit" name="btnIngresar" value="Ingresar" id="btnIngresar">
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script>
        document.getElementById('btnIngresar').addEventListener('click', function(event) {
            event.preventDefault();

            const userRole = document.getElementById('userRole').value;
            const correo = document.getElementById('txtCorreo').value;
            const contraseña = document.getElementById('txtPassword').value;

            if (userRole === 'client') {
                const usuarioCorrecto = "123";
                const contraseñaCorrecta = "123";

                if (correo === usuarioCorrecto && contraseña === contraseñaCorrecta) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userEmail', correo);

                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: 'Inicio de sesión exitoso. Redirigiendo...',
                        confirmButtonText: 'Aceptar',
                        timer: 2000,
                        timerProgressBar: true
                    }).then(() => {
                        window.location.replace('pagos_realizados.html');
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Correo o contraseña incorrectos para cliente',
                        confirmButtonText: 'Aceptar'
                    });
                }
            } else if (userRole === 'admin') {
                const adminUserCorrecto = "admin";
                const adminPasswordCorrecto = "admin123";

                if (correo === adminUserCorrecto && contraseña === adminPasswordCorrecto) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');

                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: 'Inicio de sesión exitoso. Redirigiendo al panel de administrador...',
                        confirmButtonText: 'Aceptar',
                        timer: 2000,
                        timerProgressBar: true
                    }).then(() => {
                        window.location.replace('admin_panel.html');
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Usuario o contraseña incorrectos para administrador',
                        confirmButtonText: 'Aceptar'
                    });
                }
            }
        });

        function mostrarOcultarMenu() {
            const nav = document.getElementById('nav');
            nav.classList.toggle('visible');
        }
    </script>
</body>
</html>
