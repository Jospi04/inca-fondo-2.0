<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administrador para gestionar clientes de IncaFondo">
    <title>Panel de Administrador - IncaFondo</title>
    <link rel="icon" type="image/ico" href="img/money2.png">
    <link rel="stylesheet" href="css/admin_panel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</head>
<body class="flex flex-col">
    <!-- Verificación de sesión -->
    <script>
        if (!sessionStorage.getItem('isAdminLoggedIn')) {
            window.location.replace('admin_login.html');
        }
    </script>

    <!-- Sidebar -->
    <aside class="sidebar flex flex-col">
        <div class="sidebar-header">
            <a href="admin_panel.html" class="logo-text">IncaFondo</a>
            <button id="toggleSidebar" class="text-white">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="flex-1 mt-6">
            <ul>
                <li>
                    <a href="admin_panel.html" class="sidebar-link flex items-center p-4 bg-white text-[#1e3a8a] font-semibold active">
                        <i class="fas fa-users mr-3"></i>
                        <span class="sidebar-text">Clientes</span>
                    </a>
                </li>

             
                
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="content">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div class="flex items-center mb-2 md:mb-0">
                <h1 class="text-3xl font-bold text-gray-800">Panel de Administrador - IncaFondo</h1>
            </div>
            <div class="flex items-center space-x-4">
                <button id="addClientBtn" class="btn bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700">
                    <i class="fas fa-user-plus mr-2"></i>Agregar Cliente
                </button>
                <button id="logoutBtn" class="btn bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">
                    <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="grid grid-cols-1 gap-6">
            <!-- Client Table -->
            <section class="client-table">
                <h3 class="text-xl font-semibold text-gray-800 mb-4">Lista de Clientes</h3>
                <table id="clientTable">
                    <thead>
                        <tr>
                            <th>Correo</th>
                            <th>Nombre</th>
                            <th>Monto del Préstamo</th>
                            <th>Pagos Realizados</th>
                            <th>Saldo Pendiente</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Se llenará dinámicamente -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Custom Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle Sidebar
            const sidebar = document.querySelector('.sidebar');
            const content = document.querySelector('.content');
            document.getElementById('toggleSidebar').addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                content.classList.toggle('collapsed');
            });

            // Lista de clientes (almacenada en localStorage)
            let clients = JSON.parse(localStorage.getItem('clients')) || [
                { email: "123", name: "Juan Pérez", loanAmount: 10000, paymentsMade: 2500, balance: 7500 },
                { email: "cliente2@ejemplo.com", name: "María Gómez", loanAmount: 15000, paymentsMade: 5000, balance: 10000 }
            ];

            function saveClients() {
                localStorage.setItem('clients', JSON.stringify(clients));
            }

            function updateClientTable() {
                const clientTableBody = document.querySelector('#clientTable tbody');
                clientTableBody.innerHTML = clients.map((client, index) => `
                    <tr>
                        <td>${client.email}</td>
                        <td>${client.name}</td>
                        <td>S/ ${client.loanAmount.toFixed(2)}</td>
                        <td>S/ ${client.paymentsMade.toFixed(2)}</td>
                        <td>S/ ${client.balance.toFixed(2)}</td>
                        <td>
                            <button class="action-btn edit" onclick="editClient(${index})"><i class="fas fa-edit"></i> Editar</button>
                            <button class="action-btn delete" onclick="deleteClient(${index})"><i class="fas fa-trash-alt"></i> Eliminar</button>
                        </td>
                    </tr>
                `).join('');
            }

            window.editClient = function(index) {
                const client = clients[index];
                Swal.fire({
                    title: 'Editar Cliente',
                    html: `
                        <input type="email" id="editEmail" class="border p-2 w-full mb-2 rounded" value="${client.email}" placeholder="Correo">
                        <input type="text" id="editName" class="border p-2 w-full mb-2 rounded" value="${client.name}" placeholder="Nombre">
                        <input type="number" id="editLoanAmount" class="border p-2 w-full mb-2 rounded" value="${client.loanAmount}" placeholder="Monto del Préstamo">
                        <input type="number" id="editPaymentsMade" class="border p-2 w-full mb-2 rounded" value="${client.paymentsMade}" placeholder="Pagos Realizados">
                        <input type="number" id="editBalance" class="border p-2 w-full mb-2 rounded" value="${client.balance}" placeholder="Saldo Pendiente">
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Guardar',
                    cancelButtonText: 'Cancelar',
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg mr-2',
                        cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const email = document.getElementById('editEmail').value;
                        const name = document.getElementById('editName').value;
                        const loanAmount = parseFloat(document.getElementById('editLoanAmount').value);
                        const paymentsMade = parseFloat(document.getElementById('editPaymentsMade').value);
                        const balance = parseFloat(document.getElementById('editBalance').value);

                        if (email && name && !isNaN(loanAmount) && !isNaN(paymentsMade) && !isNaN(balance)) {
                            clients[index] = { email, name, loanAmount, paymentsMade, balance };
                            saveClients();
                            updateClientTable();
                            Swal.fire({
                                icon: 'success',
                                title: '¡Guardado!',
                                text: 'Cliente actualizado correctamente.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: 'Por favor, completa todos los campos correctamente.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        }
                    }
                });
            };

            window.deleteClient = function(index) {
                Swal.fire({
                    icon: 'warning',
                    title: '¿Eliminar Cliente?',
                    text: 'Esta acción no se puede deshacer.',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, eliminar',
                    cancelButtonText: 'Cancelar',
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg mr-2',
                        cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        clients.splice(index, 1);
                        saveClients();
                        updateClientTable();
                        Swal.fire({
                            icon: 'success',
                            title: '¡Eliminado!',
                            text: 'Cliente eliminado correctamente.',
                            buttonsStyling: false,
                            customClass: {
                                confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg'
                            }
                        });
                    }
                });
            };

            document.getElementById('addClientBtn').addEventListener('click', function() {
                Swal.fire({
                    title: 'Agregar Cliente',
                    html: `
                        <input type="email" id="newEmail" class="border p-2 w-full mb-2 rounded" placeholder="Correo">
                        <input type="text" id="newName" class="border p-2 w-full mb-2 rounded" placeholder="Nombre">
                        <input type="number" id="newLoanAmount" class="border p-2 w-full mb-2 rounded" placeholder="Monto del Préstamo">
                        <input type="number" id="newPaymentsMade" class="border p-2 w-full mb-2 rounded" placeholder="Pagos Realizados" value="0">
                        <input type="number" id="newBalance" class="border p-2 w-full mb-2 rounded" placeholder="Saldo Pendiente">
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Agregar',
                    cancelButtonText: 'Cancelar',
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'btn bg-green-600 text-white px-4 py-2 rounded-lg mr-2',
                        cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const email = document.getElementById('newEmail').value;
                        const name = document.getElementById('newName').value;
                        const loanAmount = parseFloat(document.getElementById('newLoanAmount').value);
                        const paymentsMade = parseFloat(document.getElementById('newPaymentsMade').value);
                        const balance = parseFloat(document.getElementById('newBalance').value);

                        if (email && name && !isNaN(loanAmount) && !isNaN(paymentsMade) && !isNaN(balance)) {
                            clients.push({ email, name, loanAmount, paymentsMade, balance });
                            saveClients();
                            updateClientTable();
                            Swal.fire({
                                icon: 'success',
                                title: '¡Agregado!',
                                text: 'Cliente agregado correctamente.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: 'Por favor, completa todos los campos correctamente.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        }
                    }
                });
            });

            // Logout Button
            document.getElementById('logoutBtn').addEventListener('click', function() {
                Swal.fire({
                    icon: 'question',
                    title: '¿Cerrar sesión?',
                    text: 'Serás redirigido a la página de login.',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, cerrar sesión',
                    cancelButtonText: 'Cancelar',
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg mr-2',
                        cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        sessionStorage.removeItem('isAdminLoggedIn');
                        window.location.replace('admin_login.html');
                    }
                });
            });

            // Initial call
            updateClientTable();
        });
    </script>
</body>
</html>
