<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pagos realizados para el sistema de préstamos IncaFondo">
    <title>Pagos Realizados - IncaFondo</title>
    <link rel="icon" type="image/ico" href="img/money2.png">
    <link rel="stylesheet" href="css/pagos_realizados.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
</head>
<body class="flex flex-col">
    <!-- Verificación de sesión -->
    <script>
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.replace('inicio.html');
        }
    </script>

    <!-- Sidebar -->
    <aside class="sidebar flex flex-col">
        <div class="sidebar-header">
            <a href="#" class="logo-text">IncaFondo</a>
            <button id="toggleSidebar" class="text-white">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="flex-1 mt-6">
            <ul>
                <li>
                    <a href="notifi.html" class="sidebar-link flex items-center p-4 bg-white text-[#1e3a8a] font-semibold active">
                        <i class="fas fa-money-check-alt mr-3"></i>
                        <span class="sidebar-text">Pagos</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="content">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6">
            <div class="flex items-center mb-2 md:mb-0">
                <h1 class="text-3xl font-bold text-gray-800">Pagos Realizados - IncaFondo</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <span class="text-gray-600 text-lg">Año: 2025</span>
                    <i class="fas fa-chevron-down text-gray-600"></i>
                </div>
                <button id="logoutBtn" class="btn bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">
                    <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
                </button>

                

            </div>
        </header>

        <!-- Banner -->
        <div class="banner text-white p-4 mb-6 flex flex-col md:flex-row justify-between items-center">
            <span class="text-lg md:text-xl font-medium">REVISIÓN DE PAGOS REALIZADOS</span>
            <button id="exportPDFBtn" class="text-white hover:underline mt-2 md:mt-0 text-lg md:text-xl font-medium">Exportar PDF</button>
        </div>

        <!-- Main Dashboard -->
        <main class="grid grid-cols-1 gap-6">
            <!-- Welcome Message -->
            <section class="mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Bienvenido, <span id="userEmail">usuario@ejemplo.com</span></h2>
                <p class="text-lg text-gray-600 mt-2">Consulta aquí tus pagos realizados.</p>
            </section>

            <!-- Dashboard Grid -->
            <section class="dashboard-grid">
                <!-- Left Section: Metrics -->
                <div class="card">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Resumen de Pagos</h3>
                    <!-- Metrics -->
                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="flex items-center mb-2">
                                <i class="fas fa-money-check-alt mr-2 text-green-600 text-lg"></i>
                                <span class="text-lg text-gray-600">Total Pagado</span>
                            </div>
                            <p class="text-2xl font-bold text-gray-800">S/ 1,000</p>
                        </div>
                        <div class="metric-item">
                            <div class="flex items-center mb-2">
                                <i class="fas fa-calendar-check mr-2 text-blue-600 text-lg"></i>
                                <span class="text-lg text-gray-600">Último Pago</span>
                            </div>
                            <p class="text-2xl font-bold text-gray-800">03 Jul</p>
                        </div>
                    </div>
                </div>

                <!-- Center Section: Calendar -->
                <div class="calendar">
                    <div class="calendar-header">
                        <h3 class="text-xl font-semibold text-gray-800">Mayo 2025</h3>
                        <div>
                            <button id="prevMonth" class="btn text-gray-600 hover:text-gray-800"><i class="fas fa-chevron-left"></i></button>
                            <button id="nextMonth" class="btn text-gray-600 hover:text-gray-800"><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid">
                        <div class="day-name">LUN</div>
                        <div class="day-name">MAR</div>
                        <div class="day-name">MIÉ</div>
                        <div class="day-name">JUE</div>
                        <div class="day-name">VIE</div>
                        <div class="day-name">SÁB</div>
                        <div class="day-name">DOM</div>
                        <!-- Los días se generarán dinámicamente con JavaScript -->
                    </div>
                </div>

                <!-- Right Section: Event List -->
                <div class="event-list">
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Pagos Realizados</h3>
                    <div id="eventList">
                        <!-- Se llenará dinámicamente -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Custom Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Toggle Sidebar
            const sidebar = document.querySelector('.sidebar');
            const content = document.querySelector('.content');
            if (document.getElementById('toggleSidebar')) {
                document.getElementById('toggleSidebar').addEventListener('click', function() {
                    sidebar.classList.toggle('collapsed');
                    content.classList.toggle('collapsed');
                });
            }

            // Calendar Logic
            let currentDate = new Date(2025, 4, 1); // Mayo 2025 por defecto
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const events = JSON.parse(localStorage.getItem('paymentEvents')) || [
                { title: 'Pago #1', date: '2025-05-03', amount: 1000, method: 'Transferencia', color: '#ef4444' },
                { title: 'Pago #2', date: '2025-06-03', amount: 1500, method: 'Efectivo', color: '#ef4444' },
                { title: 'Pago #3', date: '2025-07-03', amount: 500, method: 'Pendiente', color: '#eab308' },
                { title: 'Pago #4', date: '2025-08-03', amount: 500, method: 'Pendiente', color: '#eab308' }
            ];

            function updateCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const calendarGrid = document.getElementById('calendarGrid');
                const today = new Date(2025, 4, 11); // 11 de mayo de 2025 como "hoy"

                // Update header
                document.querySelector('.calendar-header h3').textContent = `${monthNames[month]} ${year}`;

                // Clear previous days (except day names)
                while (calendarGrid.children.length > 7) {
                    calendarGrid.removeChild(calendarGrid.lastChild);
                }

                // Add empty days before the first day of the month
                const adjustedFirstDay = firstDay === 0 ? 6 : firstDay - 1; // Ajuste para que lunes sea 0
                for (let i = 0; i < adjustedFirstDay; i++) {
                    const emptyDay = document.createElement('div');
                    calendarGrid.appendChild(emptyDay);
                }

                // Add days of the month
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.classList.add('day');
                    dayDiv.textContent = day;

                    const currentDay = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    if (currentDay === today.toISOString().split('T')[0]) {
                        dayDiv.classList.add('today');
                    }

                    const dayEvents = events.filter(event => event.date === currentDay);
                    if (dayEvents.length > 0) {
                        dayDiv.classList.add('event');
                        if (dayEvents.some(event => event.color === '#eab308')) {
                            dayDiv.classList.add('completed');
                        }
                    }

                    dayDiv.addEventListener('click', function() {
                        const existingEvents = events.filter(event => event.date === currentDay);
                        if (existingEvents.length > 0) {
                            Swal.fire({
                                title: `Pagos - ${currentDay}`,
                                html: existingEvents.map(event => `
                                    <p><strong>${event.title}</strong></p>
                                    <p>Importe: S/ ${event.amount.toFixed(2)}</p>
                                    <p>Método: ${event.method}</p>
                                    <p>Estado: ${event.color === '#ef4444' ? 'Pendiente' : 'Realizado'}</p>
                                `).join('<hr>'),
                                showCancelButton: true,
                                confirmButtonText: 'Agregar Otro Pago',
                                cancelButtonText: 'Cerrar',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg mr-2',
                                    cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                                }
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    showAddPaymentModal(currentDay);
                                }
                            });
                        } else {
                            showAddPaymentModal(currentDay);
                        }
                    });

                    calendarGrid.appendChild(dayDiv);
                }
            }

            function showAddPaymentModal(currentDay) {
                Swal.fire({
                    title: `Agregar Pago - ${currentDay}`,
                    html: `
                        <input type="text" id="eventTitle" class="border p-2 w-full mb-2 rounded" placeholder="Nombre del pago (ej. Pago #5)">
                        <input type="number" id="eventAmount" class="border p-2 w-full mb-2 rounded" placeholder="Importe (ej. 500)">
                        <input type="text" id="eventMethod" class="border p-2 w-full mb-2 rounded" placeholder="Método (ej. Transferencia)">
                        <select id="eventColor" class="border p-2 w-full mt-2 rounded">
                            <option value="#ef4444">Pendiente (Rojo)</option>
                            <option value="#eab308">Realizado (Amarillo)</option>
                        </select>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Guardar',
                    cancelButtonText: 'Cancelar',
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg mr-2',
                        cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        const title = document.getElementById('eventTitle').value;
                        const amount = document.getElementById('eventAmount').value;
                        const method = document.getElementById('eventMethod').value;
                        const color = document.getElementById('eventColor').value;
                        if (title && amount && method) {
                            events.push({
                                title: title,
                                date: currentDay,
                                amount: parseFloat(amount),
                                method: method,
                                color: color
                            });
                            saveEvents();
                            updateCalendar();
                            updateEventList();
                            Swal.fire({
                                icon: 'success',
                                title: '¡Guardado!',
                                text: 'El pago ha sido agregado.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-blue-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: 'Por favor, completa todos los campos.',
                                buttonsStyling: false,
                                customClass: {
                                    confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg'
                                }
                            });
                        }
                    }
                });
            }

            function updateEventList() {
                const eventList = document.getElementById('eventList');
                eventList.innerHTML = events.map(event => `
                    <div class="event-item">
                        <p><strong>${event.title}</strong></p>
                        <p>${new Date(event.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })} - S/ ${event.amount.toFixed(2)}</p>
                        <p>${event.method} - ${event.color === '#ef4444' ? 'Pendiente' : 'Realizado'}</p>
                    </div>
                `).join('');
            }

            function saveEvents() {
                localStorage.setItem('paymentEvents', JSON.stringify(events));
            }

            // Navigation
            if (document.getElementById('prevMonth')) {
                document.getElementById('prevMonth').addEventListener('click', function() {
                    currentDate.setMonth(currentDate.getMonth() - 1);
                    updateCalendar();
                    updateEventList();
                });
            }

            if (document.getElementById('nextMonth')) {
                document.getElementById('nextMonth').addEventListener('click', function() {
                    currentDate.setMonth(currentDate.getMonth() + 1);
                    updateCalendar();
                    updateEventList();
                });
            }

            // Export PDF Button
            if (document.getElementById('exportPDFBtn')) {
                document.getElementById('exportPDFBtn').addEventListener('click', function() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const userEmail = sessionStorage.getItem('userEmail') || 'usuario@ejemplo.com';
                    const totalPagado = events.reduce((sum, event) => sum + (event.color === '#eab308' ? event.amount : 0), 0);
                    const ultimoPago = events.filter(event => event.color === '#eab308').sort((a, b) => new Date(b.date) - new Date(a.date))[0]?.date || 'N/A';

                    // Título
                    doc.setFontSize(22);
                    doc.text('Pagos Realizados - IncaFondo', 105, 20, { align: 'center' });

                    // Línea divisoria
                    doc.setLineWidth(0.5);
                    doc.line(20, 30, 190, 30);

                    // Información del usuario
                    doc.setFontSize(12);
                    doc.text(`Usuario: ${userEmail}`, 20, 40);

                    // Resumen de pagos
                    doc.setFontSize(16);
                    doc.text('Resumen de Pagos', 20, 50);
                    doc.setFontSize(12);
                    doc.text(`Total Pagado: S/ ${totalPagado.toFixed(2)}`, 20, 60);
                    doc.text(`Último Pago: ${new Date(ultimoPago).toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' }) || 'N/A'}`, 20, 70);

                    // Lista de pagos
                    doc.setFontSize(16);
                    doc.text('Lista de Pagos', 20, 80);
                    events.forEach((event, index) => {
                        const y = 90 + (index * 10);
                        if (y > 280) {
                            doc.addPage();
                            doc.text('Lista de Pagos (Continuación)', 20, 20);
                            doc.text(`${event.title} - ${new Date(event.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })} - S/ ${event.amount.toFixed(2)} - ${event.method} - ${event.color === '#ef4444' ? 'Pendiente' : 'Realizado'}`, 20, 30);
                        } else {
                            doc.text(`${event.title} - ${new Date(event.date).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' })} - S/ ${event.amount.toFixed(2)} - ${event.method} - ${event.color === '#ef4444' ? 'Pendiente' : 'Realizado'}`, 20, y);
                        }
                    });

                    // Descargar PDF
                    doc.save('pagos_realizados.pdf');
                });
            }

            // Logout Button
            if (document.getElementById('logoutBtn')) {
                document.getElementById('logoutBtn').addEventListener('click', function() {
                    Swal.fire({
                        icon: 'question',
                        title: '¿Cerrar sesión?',
                        text: 'Serás redirigido a la página de inicio.',
                        showCancelButton: true,
                        confirmButtonText: 'Sí, cerrar sesión',
                        cancelButtonText: 'Cancelar',
                        buttonsStyling: false,
                        customClass: {
                            confirmButton: 'btn bg-red-600 text-white px-4 py-2 rounded-lg mr-2',
                            cancelButton: 'btn bg-gray-300 text-gray-800 px-4 py-2 rounded-lg'
                        }
                    }).then((result) => {
                        if (result.isConfirmed) {
                            sessionStorage.removeItem('isLoggedIn');
                            sessionStorage.removeItem('userEmail');
                            localStorage.removeItem('paymentEvents');
                            window.location.replace('inicio.html');
                        }
                    });
                });
            }

            // Set User Email
            const userEmail = sessionStorage.getItem('userEmail') || 'usuario@ejemplo.com';
            if (document.getElementById('userEmail')) {
                document.getElementById('userEmail').textContent = userEmail;
            }

            // Initial call
            updateCalendar();
            updateEventList();
        });
    </script>
</body>
</html>
