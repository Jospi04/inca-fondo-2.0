<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="admin, login, administrador">
    <meta name="description" content="Login para administradores de IncaFondo">
    <title>Login Administrador - IncaFondo</title>
    <link rel="icon" type="image/ico" href="imagenes/logo.ico">
    <link rel="stylesheet" href="css/reg.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="contenedor-header">
        <header>
            <div class="logo">
                <a href="#">IncaFondo</a>
            </div>
            <nav id="nav">
                <ul>
                  
                </ul>
            </nav>
            <div class="nav-responsive" onclick="mostrarOcultarMenu()">
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>
    </div>

    <section id="inicio" class="inicio">
        <main class="container login">
            <div class="login-information">
                <div class="info-childs">
                    <h2>Bienvenido, Administrador</h2>
                    <p>Accede al panel de administración para gestionar los clientes de IncaFondo.</p>
                </div>
            </div>
            <div class="registro-information">
                <div class="registro-information-childs">
                    <h2>Iniciar Sesión (Admin)</h2>
                    <form>
                        <label for="">
                            <i class='bx bxs-user'></i>
                            <input type="text" name="txtAdminUser" id="txtAdminUser" placeholder="Usuario Admin">
                        </label>
                        <label for="">
                            <i class='bx bxs-lock-alt'></i>
                            <input type="password" name="txtAdminPassword" id="txtAdminPassword" placeholder="Contraseña Admin">
                        </label>
                        <input type="submit" name="btnAdminLogin" value="Ingresar" id="btnAdminLogin">
                    </form>
                </div>
            </div>
        </main>
    </section>

    <script>
        document.getElementById('btnAdminLogin').addEventListener('click', function(event) {
            event.preventDefault();

            const adminUserCorrecto = "admin";
            const adminPasswordCorrecto = "admin123";

            const adminUser = document.getElementById('txtAdminUser').value;
            const adminPassword = document.getElementById('txtAdminPassword').value;

            if (adminUser === adminUserCorrecto && adminPassword === adminPasswordCorrecto) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                Swal.fire({
                    icon: 'success',
                    title: '¡Éxito!',
                    text: 'Inicio de sesión exitoso. Redirigiendo al panel de administrador...',
                    confirmButtonText: 'Aceptar',
                    timer: 2000,
                    timerProgressBar: true
                }).then(() => {
                    window.location.replace('admin_panel.html');
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Usuario o contraseña incorrectos',
                    confirmButtonText: 'Aceptar'
                });
            }
        });

        function mostrarOcultarMenu() {
            const nav = document.getElementById('nav');
            nav.classList.toggle('visible');
        }
    </script>
</body>
</html>
